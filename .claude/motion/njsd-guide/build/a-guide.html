<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NJSD Capital: The Financial Guide (Video A)</title>
<!-- Level 1, code only. Vertical 1080x1920. Navy + gold (the brand's formal palette for financial material).
     Preview: open in a browser (loops). ?t=6.2 holds one frame. -->
<style>
  @font-face{font-family:'Oswald';font-weight:500;src:url('vendor/fonts/Oswald-500.woff2') format('woff2');}
  @font-face{font-family:'Oswald';font-weight:600;src:url('vendor/fonts/Oswald-600.woff2') format('woff2');}
  @font-face{font-family:'Oswald';font-weight:700;src:url('vendor/fonts/Oswald-700.woff2') format('woff2');}
  @font-face{font-family:'Archivo';font-weight:400;src:url('vendor/fonts/Archivo-400.woff2') format('woff2');}
  @font-face{font-family:'Archivo';font-weight:500;src:url('vendor/fonts/Archivo-500.woff2') format('woff2');}
  @font-face{font-family:'Archivo';font-weight:600;src:url('vendor/fonts/Archivo-600.woff2') format('woff2');}
  html,body{margin:0;background:#1B2A4A;}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#1B2A4A;font-family:'Archivo',sans-serif;}
  #bg{position:absolute;inset:0;}
  .abs{position:absolute;left:0;top:0;}
  #world{position:absolute;inset:0;transform-origin:540px 960px;}
  /* coin */
  #coin{width:620px;height:620px;transform-style:preserve-3d;}
  #coin img{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;}
  #coin .back{transform:rotateY(180deg);clip-path:circle(49.6% at 50% 50%);}
  /* book */
  #scene{position:absolute;left:0;top:0;width:1080px;height:1920px;perspective:2200px;perspective-origin:540px 900px;}
  #book{position:absolute;transform-style:preserve-3d;}
  .face{position:absolute;box-sizing:border-box;backface-visibility:hidden;}
  #cover{transform-style:preserve-3d;transform-origin:0 50%;}
  #coverFront{inset:0;}
  #ring{position:absolute;box-sizing:border-box;border:solid #D4AF37;}
  #ringInner{position:absolute;box-sizing:border-box;border:2px solid rgba(212,175,55,.55);}
  #art{position:absolute;clip-path:circle(47.8% at 50% 50%);}
  #coverBack{inset:0;background:#14213D;transform:rotateY(180deg);border:10px solid #D4AF37;border-radius:14px;}
  #page{background:#F8F9FA;border-radius:6px 14px 14px 6px;}
  #spine{background:linear-gradient(90deg,#101B33,#1a2950 50%,#101B33);}
  #edge{background:repeating-linear-gradient(90deg,#e9e6dd 0 2px,#f8f9fa 2px 5px);}
  #backCover{background:#14213D;border-radius:14px;}
  .t{position:absolute;white-space:nowrap;}
  .word{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .08em;line-height:1.18;}
  .word span{display:inline-block;will-change:transform,filter;}
  #title{left:-40px;right:-40px;text-align:center;font-family:'Oswald';font-weight:600;color:#D4AF37;letter-spacing:.02em;}
  #sub{left:0;right:0;text-align:center;font-weight:500;color:#F8F9FA;letter-spacing:.32em;}
  #kicker{left:0;width:1080px;top:250px;text-align:center;font-family:'Oswald';font-weight:500;font-size:34px;letter-spacing:.42em;color:#D4AF37;}
  #list{position:absolute;}
  .row{position:absolute;left:0;white-space:nowrap;font-family:'Oswald';font-weight:600;color:#1B2A4A;font-size:40px;letter-spacing:.02em;}
  .row b{color:#D4AF37;font-weight:600;margin-right:18px;}
  #pagehead{position:absolute;font-family:'Oswald';font-weight:500;letter-spacing:.35em;font-size:24px;color:#B08A1E;}
  #logo{position:absolute;}
  #soon{left:0;width:1080px;top:1240px;text-align:center;font-family:'Oswald';font-weight:600;font-size:64px;letter-spacing:.3em;color:#D4AF37;}
  #tag{left:0;width:1080px;top:1340px;text-align:center;font-size:34px;color:#F8F9FA;letter-spacing:.04em;}
  #url{left:0;width:1080px;top:1404px;text-align:center;font-size:30px;color:#D4AF37;letter-spacing:.12em;}
  #fine{left:0;width:1080px;top:1800px;text-align:center;font-size:22px;color:rgba(248,249,250,.55);letter-spacing:.04em;}
  #sweep{position:absolute;pointer-events:none;mix-blend-mode:screen;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <div id="world">
    <div id="scene">
      <div id="book">
        <div class="face" id="backCover"></div>
        <div class="face" id="spine"></div>
        <div class="face" id="edge"></div>
        <div class="face" id="page">
          <div id="pagehead">INSIDE THE GUIDE</div>
          <div id="list"></div>
        </div>
        <div class="face" id="cover">
          <div class="face" id="coverFront">
            <div id="ring"></div>
            <div id="ringInner"></div>
            <img id="art" src="../assets/logos/derived_Emblem_Gold-on-Navy_cropped-from-Formal.svg">
            <div class="t" id="title"></div>
            <div class="t" id="sub"></div>
          </div>
          <div class="face" id="coverBack"></div>
        </div>
      </div>
      <div id="coin" class="abs">
        <img src="../assets/logos/SDV_Monogram_Circle_Gold.svg">
        <img class="back" src="../assets/logos/derived_Emblem_Gold-on-Navy_cropped-from-Formal.svg">
      </div>
    </div>
    <div class="t" id="kicker"></div>
    <img id="logo" src="../assets/logos/SDV_Logo_Horizontal_Formal_on-Navy.svg">
    <div id="sweep"></div>
    <div class="t" id="soon"></div>
    <div class="t" id="tag"></div>
    <div class="t" id="url"></div>
  </div>
  <div class="t" id="fine"></div>
</div>
<script>
const B = {
  start: 0,
  'coin.land': 1.4,
  'coin.flip': 2.0, 'coin.flipped': 3.0,
  'cover.grow': 3.5, 'cover.grown': 4.7,
  'title.in': 4.6,
  'kicker.in': 5.3,
  'cover.open': 7.4, 'cover.opened': 8.6,
  'list.in': 8.5,
  'list.out': 10.9,
  'cover.close': 11.3, 'cover.closed': 12.2,
  'emblem.fly': 12.2, 'emblem.land': 13.2,
  'logo.reveal': 13.2, 'logo.revealed': 14.0,
  'soon.in': 14.0,
  end: 16,
};
const W=1080,H=1920,CX=540,CY=960;
const clamp=x=>Math.min(1,Math.max(0,x)), span=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,4), eio=x=>x<.5?8*x*x*x*x:1-Math.pow(-2*x+2,4)/2;
const lerp=(a,b,k)=>a+(b-a)*k;
const $=id=>document.getElementById(id);

function words(el,list,cls){ return list.map(w=>{const box=document.createElement('span');box.className='word';const s=document.createElement('span');s.innerHTML=w;box.append(s);if(el.childNodes.length)el.append(document.createTextNode(' '));el.append(box);return s;}); }
function slide(spans,t,tin,tout,gap=0.09,dur=0.55){ spans.forEach((s,i)=>{const up=eo(span(t,tin+i*gap,tin+i*gap+dur)); const away=tout==null?0:eio(span(t,tout+i*gap*.5,tout+i*gap*.5+.4)); s.style.transform=`translateY(${(1-up)*112-away*112}%)`; s.style.filter=`blur(${(1-up)*6+away*6}px)`;}); }

// copy (placeholder for a proposed product; edit before publishing)
const titleW=words($('title'),['THE','FINANCIAL','GUIDE']);
const subW=words($('sub'),['NJSD','CAPITAL','LLC']);
const kickW=words($('kicker'),['FINANCIAL','COACHING']);
const ROWS=[['01','KNOW YOUR NUMBERS'],['02','BUILD YOUR CUSHION'],['03','GROW YOUR LEGACY']];
const rows=ROWS.map(([n,txt],i)=>{const r=document.createElement('div');r.className='row';r.style.top=(i*92)+'px';const w=document.createElement('span');w.className='word';const s=document.createElement('span');s.innerHTML=`<b>${n}</b>${txt}`;w.append(s);r.append(w);$('list').append(r);return s;});
const soonW=words($('soon'),['COMING','SOON']);
const tagW=words($('tag'),['Scott','Davis','Ventures','&middot;','Financial','Coaching']);
const urlW=words($('url'),['njsdcapital.com']);
const fineW=words($('fine'),'Concept preview. Educational content, not financial advice.'.split(' '));

// geometry
const S0=620, U0=S0/360;                 // coin/emblem box at full size
const COVER_W=560, COVER_H=760, THICK=46;
const LOGO_W=960, LU=LOGO_W/1132, LOGO_X=(W-LOGO_W)/2, LOGO_Y=CY-180*LU - 40;
const END_EMB={x:LOGO_X+180*LU, y:LOGO_Y+180*LU, size:360*LU};

const bg=$('bg').getContext('2d');
function drawBg(t){
  bg.fillStyle='#1B2A4A'; bg.fillRect(0,0,W,H);
  const fade=1-eio(span(t,B['emblem.fly'],B['logo.reveal']));
  bg.globalAlpha=fade;
  for(const [ph,r,c,ax,ay] of [[0,760,'rgba(212,175,55,0.10)',300,380],[2.1,620,'rgba(246,103,51,0.05)',380,520],[4.2,900,'rgba(10,18,36,0.35)',420,300]]){
    const x=CX+Math.cos(t*.21+ph)*ax, y=CY+Math.sin(t*.16+ph)*ay;
    const g=bg.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,c); g.addColorStop(1,'rgba(27,42,74,0)'); bg.fillStyle=g; bg.fillRect(0,0,W,H);
  }
  bg.globalAlpha=1;
}

function seek(t){
  drawBg(t);
  const world=$('world');
  world.style.transform=`scale(${1+0.015*Math.sin(t*0.4)*(1-span(t,B['emblem.fly'],B['emblem.land']))+0.035*eio(span(t,B['logo.reveal'],B.end))})`;

  // ---- coin: arrives, spins, flips to the emblem ----
  const arrive=eo(span(t,0,B['coin.land']));
  const flip=eio(span(t,B['coin.flip'],B['coin.flipped']));
  const coinScale=lerp(0.25,1,arrive);
  const coinRot=(1-arrive)*-540 + flip*180 + Math.sin(t*1.1)*4*(1-flip);
  const coin=$('coin');
  const coinVisible=t<B['coin.flipped'];
  coin.style.display=coinVisible?'block':'none';
  coin.style.transform=`translate(${CX-S0/2}px,${CY-S0/2}px) scale(${coinScale}) rotateY(${coinRot}deg) rotateX(${(1-arrive)*25}deg)`;

  // ---- emblem -> cover -> (open/close) -> emblem -> logo ----
  const grow=eio(span(t,B['cover.grow'],B['cover.grown']));
  const back=eio(span(t,B['emblem.fly'],B['emblem.land']));        // cover collapses back into an emblem and flies to the logo
  const shape=grow*(1-back);                                         // 0 = circle, 1 = book cover
  const showBook=t>=B['coin.flipped'] && t<B['emblem.land']+0.0001;
  const book=$('book');
  book.style.display=showBook?'block':'none';

  // emblem size/position when it is a circle: start at centre (full), end at the logo's emblem
  const embSize=lerp(S0, END_EMB.size, back), embX=lerp(CX, END_EMB.x, back), embY=lerp(CY, END_EMB.y, back);
  const u=embSize/360;
  const ringD=lerp(358*u, COVER_W, shape), ringH=lerp(358*u, COVER_H, shape);
  const ringB=lerp(6*u, 10, shape);
  const bw=ringD, bh=ringH;
  const bx=embX-bw/2, by=embY-bh/2;
  // 3D: thickness grows with the cover, slow turn while it is a book
  const turnIn=eio(span(t,B['cover.grow']+0.4,B['cover.grown']+0.8))*(1-eio(span(t,B['cover.close'],B['cover.closed'])));
  const ry=turnIn*(-24+Math.sin(t*0.5)*4) + 0;
  const rx=turnIn*(6+Math.cos(t*0.4)*1.5);
  const th=THICK*shape;
  book.style.width=bw+'px'; book.style.height=bh+'px';
  book.style.transform=`translate(${bx}px,${by}px) rotateX(${rx}deg) rotateY(${ry}deg)`;
  const radius=lerp(ringD/2,14,shape);
  // faces
  const cover=$('cover'), front=$('coverFront');
  cover.style.width=bw+'px'; cover.style.height=bh+'px';
  const open=eio(span(t,B['cover.open'],B['cover.opened']))*(1-eio(span(t,B['cover.close'],B['cover.closed'])));
  cover.style.transform=`translateZ(${th/2}px) rotateY(${-128*open}deg)`;
  front.style.borderRadius=radius+'px';
  front.style.background=`rgba(20,33,61,${shape})`;
  const ring=$('ring');
  ring.style.left='0px'; ring.style.top='0px'; ring.style.width=bw+'px'; ring.style.height=bh+'px';
  ring.style.borderWidth=ringB+'px'; ring.style.borderRadius=radius+'px';
  const ri=$('ringInner'); const inset=lerp(12*u,26,shape);
  ri.style.left=inset+'px'; ri.style.top=inset+'px'; ri.style.width=(bw-2*inset)+'px'; ri.style.height=(bh-2*inset)+'px'; ri.style.borderRadius=Math.max(0,radius-inset)+'px';
  ri.style.opacity=shape;   // the thin inner rule only exists on the cover
  // art: full emblem at circle stage, a foil stamp on the cover
  const artSize=lerp(embSize, 300, shape);
  const art=$('art');
  art.style.width=artSize+'px'; art.style.height=artSize+'px';
  art.style.left=(bw/2-artSize/2)+'px'; art.style.top=lerp(bh/2-artSize/2, 92, shape)+'px';
  // spine, page edge, back cover, page
  const sp=$('spine'); sp.style.width=th+'px'; sp.style.height=bh+'px'; sp.style.transform=`translateX(${-th/2}px) rotateY(-90deg)`; sp.style.left='0px';
  const ed=$('edge'); ed.style.width=th+'px'; ed.style.height=(bh-16)+'px'; ed.style.top='8px'; ed.style.left=(bw-th/2-4)+'px'; ed.style.transform=`rotateY(90deg)`;
  const bc=$('backCover'); bc.style.width=bw+'px'; bc.style.height=bh+'px'; bc.style.transform=`translateZ(${-th/2}px) rotateY(180deg)`; bc.style.borderRadius=radius+'px';
  const pg=$('page'); pg.style.width=(bw-14)+'px'; pg.style.height=(bh-16)+'px'; pg.style.left='4px'; pg.style.top='8px'; pg.style.transform=`translateZ(${th/2-2}px)`;
  pg.style.visibility=shape>0.98?'visible':'hidden';
  sp.style.visibility=ed.style.visibility=bc.style.visibility=shape>0.35?'visible':'hidden';
  const ph=$('pagehead'); ph.style.left='60px'; ph.style.top='120px';
  const list=$('list'); list.style.left='60px'; list.style.top='210px';
  // cover text
  const title=$('title'); title.style.top=(92+300+40)+'px'; title.style.fontSize='52px';
  const sub=$('sub'); sub.style.top=(92+300+40+86)+'px'; sub.style.fontSize='26px';
  slide(titleW,t,B['title.in'],B['cover.close']+0.0,0.12,0.6);
  slide(subW,t,B['title.in']+0.45,B['cover.close'],0.08,0.5);
  title.style.visibility=sub.style.visibility=(t>B['cover.grow']&&t<B['emblem.fly'])?'visible':'hidden';
  slide(kickW,t,B['kicker.in'],B['cover.close'],0.12,0.6);
  slide(rows,t,B['list.in'],B['list.out'],0.32,0.6);

  // ---- end card: the emblem lands exactly on the logo's own emblem, then the wordmark slides out from behind it ----
  const logo=$('logo');
  logo.style.width=LOGO_W+'px'; logo.style.left=LOGO_X+'px'; logo.style.top=LOGO_Y+'px';
  const reveal=eo(span(t,B['logo.reveal'],B['logo.revealed']));
  logo.style.display=t>=B['emblem.land']?'block':'none';
  const hide=(1-360/1132)*100*(1-reveal);
  logo.style.clipPath=`inset(0 ${hide}% 0 0)`;
  // light sweep across the logo on the hold
  const sw=$('sweep'); const sx=lerp(-400,W+200,span(t,B['logo.revealed']+0.3,B.end-0.2));
  sw.style.left=LOGO_X+'px'; sw.style.top=LOGO_Y+'px'; sw.style.width=LOGO_W+'px'; sw.style.height=(360*LU)+'px';
  sw.style.background=`linear-gradient(105deg, rgba(255,255,255,0) ${sx-LOGO_X-160}px, rgba(255,240,200,0.16) ${sx-LOGO_X}px, rgba(255,255,255,0) ${sx-LOGO_X+160}px)`;
  sw.style.display='none';
  slide(soonW,t,B['soon.in'],null,0.14,0.6);
  slide(tagW,t,B['soon.in']+0.35,null,0.05,0.5);
  slide(urlW,t,B['soon.in']+0.7,null,0.05,0.5);
  slide(fineW,t,B['soon.in']+1.0,null,0.02,0.45);
}
window.ad={duration:B.end,width:W,height:H,events:B,seek,ready:Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode().catch(()=>{}))])};
const held=new URLSearchParams(location.search).get('t');
if(held!==null) window.ad.ready.then(()=>seek(Number(held)));
else if(!navigator.webdriver){const t0=performance.now();(function loop(){seek(((performance.now()-t0)/1000)%B.end);requestAnimationFrame(loop);})();}
else seek(0);
</script>
</body>
</html>
